[package]
name = "ltk-meta-docs"
version = "0.1.0"
description = "The LoL Meta Wiki's class and property documentation, cached for LTK Manager"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on what crosses IPC.
ts = ["dep:specta"]

[dependencies]
fs-err = { workspace = true }
ltk_hash = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
