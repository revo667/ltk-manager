[package]
name = "ltk-manager-base"
version = "0.1.0"
description = "Shared settings, errors, events and helpers for LTK Manager"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on the types that cross IPC, so the Tauri shell can export bindings.
ts = ["dep:specta"]

[dependencies]
camino = { workspace = true }
fs-err = { workspace = true }
image = { workspace = true }
ltk_fantome = { workspace = true }
ltk_hash = { workspace = true }
ltk_mod_project = { workspace = true }
ltk_modpkg = { workspace = true }
ltk_overlay = { workspace = true }
ltk_wad = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
webp = { workspace = true }
zip = { workspace = true }
specta = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_matches = { workspace = true }
tempfile = { workspace = true }
