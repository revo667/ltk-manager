[package]
name = "ltk-manager-audio"
version = "0.1.0"
description = "Wwise banks, packages, the sound lookup and WEM decoding for LTK Manager"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on the types that cross IPC, so the Tauri shell can export bindings.
ts = ["dep:specta", "ltk-manager-assets/ts"]

[dependencies]
ltk-manager-assets = { workspace = true }
ltk-manager-base = { workspace = true }

lewton = { workspace = true }
lru = { workspace = true }
ltk_hash = { workspace = true }
ltk_meta = { workspace = true }
ltk_wad = { workspace = true }
ltk_wwise = { workspace = true }
parking_lot = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ww2ogg = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
fs-err = { workspace = true }
insta = { workspace = true }
ltk-manager-assets = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
